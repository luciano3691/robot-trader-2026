<!-- ROBOT TRADER — BETA SIGNUP FORM -->
<!-- Aggiungi questo codice nella tua landing page -->

<div id="beta-signup-section" style="background: #1E3A5F; color: white; padding: 3rem 2rem; text-align: center; border-radius: 8px; margin: 2rem 0;">
    <h2 style="font-size: 2rem; margin-bottom: 1rem;">Join Robot Trader Beta</h2>
    <p style="font-size: 1.1rem; margin-bottom: 2rem;">Get free access + €50 credit</p>
    
    <form id="beta-signup-form" style="max-width: 400px; margin: 0 auto;">
        <input 
            type="text" 
            id="first_name" 
            placeholder="First Name" 
            required
            style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: none; border-radius: 4px; font-size: 1rem;"
        >
        
        <input 
            type="email" 
            id="email" 
            placeholder="Your Email" 
            required
            style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: none; border-radius: 4px; font-size: 1rem;"
        >
        
        <select 
            id="product" 
            required
            style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: none; border-radius: 4px; font-size: 1rem;"
        >
            <option value="">Select Product</option>
            <option value="AZIONI">AZIONI (Stocks)</option>
            <option value="FONDI">FONDI (Funds)</option>
            <option value="ETF">ETF</option>
        </select>
        
        <button 
            type="submit" 
            style="width: 100%; padding: 0.75rem; background: #F5A623; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem;"
        >
            Join Beta Now!
        </button>
    </form>
    
    <p id="signup-message" style="margin-top: 1rem; font-size: 0.9rem;"></p>
</div>

<script>
document.getElementById('beta-signup-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const firstName = document.getElementById('first_name').value;
    const email = document.getElementById('email').value;
    const product = document.getElementById('product').value;
    
    const messageEl = document.getElementById('signup-message');
    messageEl.textContent = 'Registering...';
    
    try {
        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                first_name: firstName,
                email: email,
                product: product,
                timestamp: new Date().toISOString()
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            messageEl.style.color = '#10B981';
            messageEl.textContent = '✅ You\'re in! Check your email for next steps.';
            document.getElementById('beta-signup-form').reset();
        } else {
            messageEl.style.color = '#EF4444';
            messageEl.textContent = '❌ ' + result.message;
        }
    } catch (error) {
        messageEl.style.color = '#EF4444';
        messageEl.textContent = '❌ Error: ' + error.message;
    }
});
</script>
