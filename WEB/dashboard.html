<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Trader 2026 — Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a2b4a;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(90deg, #FF9500 0%, #1a2b4a 100%);
            color: white;
            padding: 20px 40px;
        }
        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #FF9500;
        }
        .stat-card h3 {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #FF9500;
        }
        .panel {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .panel-header {
            background: #FF9500;
            color: white;
            padding: 15px 20px;
            font-weight: 600;
        }
        .panel-body { padding: 20px; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .refresh-btn {
            background: #FF9500;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .refresh-btn:hover { background: #E58A00; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: #f5f5f5;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #FF9500;
            font-weight: 600;
        }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Robot Trader 2026 — Dashboard</h1>
        <p>Fuerte Venture Capital / NCF New Capital Fuerte SL</p>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Azioni Selezionate</h3>
                <div class="value" id="azioni-count">-</div>
            </div>
            <div class="stat-card">
                <h3>ETF Selezionati</h3>
                <div class="value" id="etf-count">-</div>
            </div>
            <div class="stat-card">
                <h3>Fondi Selezionati</h3>
                <div class="value" id="fondi-count">-</div>
            </div>
            <div class="stat-card">
                <h3>Ultimo Aggiornamento</h3>
                <div class="value" id="last-update" style="font-size: 16px;">-</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">📊 Azioni</div>
            <div class="panel-body" id="azioni-content">
                <div class="loading">Caricamento...</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">📈 ETF</div>
            <div class="panel-body" id="etf-content">
                <div class="loading">Caricamento...</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">💼 Fondi</div>
            <div class="panel-body" id="fondi-content">
                <div class="loading">Caricamento...</div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="refresh-btn" onclick="loadDashboard()">🔄 Aggiorna</button>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('http://localhost:5000/api/dashboard');
                const data = await response.json();

                document.getElementById('last-update').textContent = new Date(data.timestamp).toLocaleTimeString('it-IT');

                // AZIONI
                if (data.azioni && data.azioni.count > 0) {
                    document.getElementById('azioni-count').textContent = data.azioni.count;
                    document.getElementById('azioni-content').innerHTML = renderTable(data.azioni.data);
                } else {
                    document.getElementById('azioni-count').textContent = '0';
                    document.getElementById('azioni-content').innerHTML = '<p>Nessun dato</p>';
                }

                // ETF
                if (data.etf && data.etf.count > 0) {
                    document.getElementById('etf-count').textContent = data.etf.count;
                    document.getElementById('etf-content').innerHTML = renderTable(data.etf.data);
                } else {
                    document.getElementById('etf-count').textContent = '0';
                    document.getElementById('etf-content').innerHTML = '<p>Nessun dato</p>';
                }

                // FONDI
                if (data.fondi && data.fondi.count > 0) {
                    document.getElementById('fondi-count').textContent = data.fondi.count;
                    document.getElementById('fondi-content').innerHTML = renderTable(data.fondi.data);
                } else {
                    document.getElementById('fondi-count').textContent = '0';
                    document.getElementById('fondi-content').innerHTML = '<p>Nessun dato</p>';
                }

            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('azioni-content').innerHTML = '<p>❌ Errore caricamento</p>';
            }
        }

        function renderTable(data) {
            if (!data || data.length === 0) return '<p>Nessun dato</p>';

            const keys = Object.keys(data[0]);
            let html = '<table><thead><tr>';
            keys.forEach(key => html += `<th>${key}</th>`);
            html += '</tr></thead><tbody>';

            data.slice(0, 5).forEach(row => {
                html += '<tr>';
                keys.forEach(key => html += `<td>${row[key] || '-'}</td>`);
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        loadDashboard();
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>
